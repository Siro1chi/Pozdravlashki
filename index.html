<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поздравления</title>
<style>
  :root{--text:#26243a;--muted:#8a87a3;--line:#ece7f5;--accent:#ff5d8f}
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;min-height:100vh;color:var(--text);background:#fdf8fc;
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(55vw 55vw at 8% -5%,#ffd6e6 0%,transparent 62%),
      radial-gradient(45vw 45vw at 102% 5%,#ddd8ff 0%,transparent 62%),
      radial-gradient(60vw 60vw at 50% 108%,#d5efff 0%,transparent 62%),
      #fdf8fc}
  .wrap{max-width:720px;margin:0 auto;padding:40px 18px 80px}
  .hero{text-align:center;margin-bottom:26px}
  .hero .emoji{font-size:44px;line-height:1;margin-bottom:6px;display:inline-block;
    animation:float 4s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px)}}
  .hero h1{margin:0 0 10px;font-size:clamp(26px,5.5vw,40px);letter-spacing:-.02em;font-weight:800}
  .hero p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
  .notice{margin-bottom:18px;padding:12px 16px;border-radius:14px;
    background:#fff7e0;border:1px solid #ffe1a1;color:#8a6100;font-size:13.5px;line-height:1.5}
  .card{background:rgba(255,255,255,.72);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);
    border-radius:26px;padding:22px;
    box-shadow:0 24px 60px -28px rgba(94,60,140,.35),0 2px 8px -2px rgba(94,60,140,.08)}
  .field{display:block;margin-bottom:16px}
  .field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);
    margin:0 0 7px 4px;letter-spacing:.02em}
  input,textarea{width:100%;font:inherit;color:var(--text);
    padding:13px 15px;border-radius:16px;border:1.5px solid var(--line);
    background:#fff;outline:none;resize:vertical;
    transition:border-color .18s,box-shadow .18s}
  input::placeholder,textarea::placeholder{color:#b7b3c9}
  input:focus,textarea:focus{border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(255,93,143,.14)}
  .counter{text-align:right;font-size:12px;color:var(--muted);margin-top:6px}
  .btn{font:inherit;font-weight:600;border:none;cursor:pointer;
    border-radius:16px;padding:14px 20px;
    transition:transform .15s,box-shadow .2s,border-color .2s,color .2s}
  .btn:active{transform:translateY(1px)}
  .btn.primary{width:100%;color:#fff;
    background:linear-gradient(135deg,#ff5d8f 0%,#a855f7 100%);
    box-shadow:0 14px 30px -12px rgba(200,60,150,.65)}
  .btn.primary:hover{box-shadow:0 18px 36px -12px rgba(200,60,150,.8)}
  .btn.primary:disabled{opacity:.6;cursor:progress;box-shadow:none}
  .btn.ghost{display:block;margin:26px auto 0;background:#fff;color:var(--text);
    border:1.5px solid var(--line);padding:14px 28px}
  .btn.ghost:hover{border-color:#d9d2ea}
  .btn.tiny{background:#fff;border:1.5px solid var(--line);border-radius:12px;
    padding:6px 12px;font-size:15px;line-height:1;color:var(--muted)}
  .btn.tiny:hover{color:var(--text);border-color:#d9d2ea}
  .status{margin:12px 0 0;font-size:14px;text-align:center;color:var(--muted);min-height:20px}
  .status.ok{color:#0f9d58}
  .status.err{color:#e5484d}
  #refreshIcon{display:inline-block}
  #refreshIcon.spin{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .list-section{margin-top:34px}
  .list-head{display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:16px}
  .list-head h2{margin:0;font-size:19px;font-weight:700;
    display:flex;align-items:center;gap:10px}
  .badge{background:linear-gradient(135deg,#ff5d8f,#a855f7);color:#fff;
    font-size:13px;font-weight:700;padding:2px 11px;border-radius:99px}
  .list{display:grid;gap:12px}
  .msg{display:flex;gap:14px;align-items:flex-start;
    background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;
    box-shadow:0 10px 26px -18px rgba(94,60,140,.45);
    animation:rise .45s cubic-bezier(.2,.8,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .avatar{flex:0 0 44px;height:44px;border-radius:50%;
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;
    background:linear-gradient(135deg,#ff8fb1,#a855f7)}
  .msg-body{min-width:0;flex:1}
  .msg-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:4px}
  .msg-name{font-weight:700}
  .msg-top time{font-size:12px;color:var(--muted)}
  .msg-text{margin:0;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
  .empty{text-align:center;color:var(--muted);padding:34px 10px;
    background:rgba(255,255,255,.6);border:1.5px dashed var(--line);border-radius:20px}
  .hint{text-align:center;font-size:13px;color:var(--muted);margin-top:16px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div>
<main class="wrap">
  <header class="hero">
    <div class="emoji">🎉</div>
    <h1>С днём рождения!</h1>
    <p>Оставьте несколько тёплых слов — они появятся в общем списке.</p>
  </header>

  <div class="notice" id="notice" hidden></div>

  <form class="card" id="form" autocomplete="off">
    <label class="field">
      <span>Ваше имя</span>
      <input id="name" maxlength="60" placeholder="Например, тётя Оля" required>
    </label>
    <label class="field">
      <span>Поздравление</span>
      <textarea id="text" maxlength="500" rows="4" placeholder="Пишите от души ✨" required></textarea>
      <div class="counter"><span id="count">0</span>/500</div>
    </label>
    <button class="btn primary" type="submit" id="sendBtn">Отправить поздравление</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>

  <button class="btn ghost" id="viewBtn">Посмотреть поздравления</button>

  <section class="list-section" id="listSection" hidden>
    <div class="list-head">
      <h2>Что уже написали <span class="badge" id="countBadge">0</span></h2>
      <button class="btn tiny" id="refreshBtn" type="button" title="Обновить сейчас">
        <span id="refreshIcon">↻</span>
      </button>
    </div>
    <div class="list" id="list"></div>
    <p class="empty" id="empty" hidden>Пока никого… Будьте первым 💌</p>
    <p class="hint">Список обновляется автоматически каждые 5 минут.</p>
  </section>
</main>

<script>
/* ==== ЕДИНСТВЕННОЕ, ЧТО НАДО ВПИСАТЬ — URL веб-приложения из Шага 3 ==== */
const API_URL = "https://script.google.com/macros/s/ВСТАВЬ_СЮДА/exec";

const REFRESH_MS = 5 * 60 * 1000;

const $ = id => document.getElementById(id);
const form=$("form"),nameEl=$("name"),textEl=$("text"),countEl=$("count"),
      sendBtn=$("sendBtn"),statusEl=$("status"),viewBtn=$("viewBtn"),
      listSection=$("listSection"),listEl=$("list"),emptyEl=$("empty"),
      countBadge=$("countBadge"),refreshBtn=$("refreshBtn"),
      refreshIcon=$("refreshIcon"),noticeEl=$("notice");

if (API_URL.includes("ВСТАВЬ")) {
  noticeEl.hidden = false;
  noticeEl.textContent = "⚠️ Впиши API_URL в index.html (URL веб-приложения Apps Script).";
}

const fmt = new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function setStatus(msg, type=""){ statusEl.textContent = msg; statusEl.className = "status" + (type?" "+type:""); }

async function fetchGreetings(){
  const res = await fetch(`${API_URL}?t=${Date.now()}`, { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  return Array.isArray(data) ? data : [];
}

async function postGreeting(name, text){
  const body = new URLSearchParams({ name, text });
  await fetch(API_URL, { method: "POST", mode: "no-cors", body });
}

function render(items){
  items.sort((a,b)=>(b.ts||0)-(a.ts||0));
  countBadge.textContent = items.length;
  emptyEl.hidden = items.length > 0;
  listEl.innerHTML = items.map((m,i)=>{
    const initial = (m.name||"?").trim().charAt(0).toUpperCase() || "?";
    const when = m.ts ? `<time datetime="${new Date(m.ts).toISOString()}">${fmt.format(new Date(m.ts))}</time>` : "";
    return `
      <article class="msg" style="animation-delay:${Math.min(i*45,360)}ms">
        <div class="avatar" aria-hidden="true">${esc(initial)}</div>
        <div class="msg-body">
          <div class="msg-top"><span class="msg-name">${esc(m.name||"Аноним")}</span>${when}</div>
          <p class="msg-text">${esc(m.text||"")}</p>
        </div>
      </article>`;
  }).join("");
}

let loading=false, timer=null;

async function refresh(silent=true){
  if (loading) return;
  loading = true;
  refreshIcon.classList.add("spin");
  try { render(await fetchGreetings()); }
  catch(e){ console.error(e); if(!silent) setStatus("Не удалось загрузить список.","err"); }
  finally { loading=false; refreshIcon.classList.remove("spin"); }
}

viewBtn.addEventListener("click", ()=>{
  listSection.hidden = false;
  viewBtn.hidden = true;
  refresh(false);
  listSection.scrollIntoView({behavior:"smooth",block:"start"});
  if (!timer) timer = setInterval(()=>refresh(true), REFRESH_MS);
});
refreshBtn.addEventListener("click", ()=>refresh(false));

textEl.addEventListener("input", ()=>{ countEl.textContent = textEl.value.length; });

form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  const name = nameEl.value.trim();
  const text = textEl.value.trim();
  if (!name || !text){ setStatus("Заполните имя и поздравление 🙂","err"); return; }

  sendBtn.disabled = true;
  setStatus("Отправляем…");
  try {
    await postGreeting(name, text);
    textEl.value = ""; countEl.textContent = "0";
    setStatus("Спасибо! Поздравление сохранено 💖","ok");

    if (listSection.hidden){
      listSection.hidden = false;
      viewBtn.hidden = true;
      if (!timer) timer = setInterval(()=>refresh(true), REFRESH_MS);
    }
    // дать таблице ~1.5 сек, потом обновить список
    setTimeout(()=>refresh(true), 1500);
  } catch (err) {
    console.error(err);
    setStatus("Не получилось отправить: " + err.message, "err");
  } finally {
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
